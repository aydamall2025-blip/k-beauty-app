<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Beauty Shop & AI Cosmetologist</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

    <header class="bg-white shadow-sm sticky top-0 z-50 px-4 py-3 flex justify-between items-center">
        <h1 id="shop-title" class="font-bold text-lg text-pink-600">Корейская Косметика</h1>
        <button onclick="openAIConsultant()" class="bg-pink-100 text-pink-700 text-xs px-3 py-1.5 rounded-full font-medium flex items-center gap-1">
            ✨ ИИ-Косметолог
        </button>
    </header>

    <main class="p-4 max-w-md mx-auto">
        <section id="ai-section" class="hidden bg-gradient-to-br from-pink-50 to-purple-50 p-4 rounded-2xl mb-6 border border-pink-100">
            <h2 class="font-bold text-md text-pink-900 mb-2">🤖 Анализ кожи с помощью ИИ</h2>
            <p class="text-xs text-slate-600 mb-3">Пройдите мини-тест, чтобы ИИ подобрал идеальный уход под ваши задачи.</p>
            <div class="space-y-2">
                <select id="skin-type" class="w-full text-xs p-2.5 bg-white rounded-xl border border-slate-200">
                    <option value="dry">Сухая кожа</option>
                    <option value="oily">Жирная кожа</option>
                    <option value="combination">Комбинированная кожа</option>
                    <option value="sensitive">Чувствительная кожа</option>
                </select>
                <select id="skin-concern" class="w-full text-xs p-2.5 bg-white rounded-xl border border-slate-200">
                    <option value="acne">Акне и высыпания</option>
                    <option value="wrinkles">Морщины и антивозрастной уход</option>
                    <option value="pigmentation">Пигментация</option>
                    <option value="dryness">Обезвоженность</option>
                </select>
                <button onclick="runAIConsultation()" class="w-full bg-pink-600 text-white font-medium py-2 rounded-xl text-xs shadow-md">
                    Получить рекомендацию ИИ
                </button>
            </div>
            <div id="ai-result" class="mt-3 text-xs text-slate-700 hidden"></div>
        </section>

        <h3 class="font-bold text-sm text-slate-700 mb-3">Популярные товары</h3>
        <div id="products-list" class="grid grid-cols-2 gap-3">
            <p class="text-xs text-slate-400 col-span-2 text-center py-6">Загрузка каталога...</p>
        </div>
    </main>

    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-4 shadow-lg flex justify-between items-center max-w-md mx-auto">
        <div>
            <p class="text-xs text-slate-500">В корзине:</p>
            <p id="cart-total" class="font-bold text-sm">0 сум / 0 ₩</p>
        </div>
        <button onclick="checkout()" class="bg-green-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-md">
            Оформить заказ
        </button>
    </div>

    <script src="app.js"></script>
</body>
</html>
